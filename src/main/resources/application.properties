spring.application.name=barbearia-web

# Mesmo banco usado pelo sistema desktop
spring.datasource.url=jdbc:mysql://localhost:3306/barbearia
spring.datasource.username=root
# A senha fica em config/application.properties (fora do git) ou na variável DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:}

# As tabelas já existem (database/barbearia.sql): o Hibernate não deve alterá-las
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Usuário responsável pelo sistema (mesmo do desktop)
barbearia.usuario=${APP_USUARIO:admin}
barbearia.senha=${APP_SENHA:admin}

server.port=8080

# Moeda e datas em português
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
